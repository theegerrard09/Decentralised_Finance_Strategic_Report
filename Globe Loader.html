<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Globe Loader</title>
<style>
  :root {
    --bg: #f1ede6;
    --ink: #1a1a1a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: var(--ink);
  }
  body {
    display: grid;
    place-items: center;
    min-height: 100vh;
  }
  .stage {
    width: 200px;
    height: 200px;
    position: relative;
    display: grid;
    place-items: center;
  }
  /* Canvas holds globe + whirl arcs */
  canvas {
    width: 200px;
    height: 200px;
    display: block;
  }
</style>
</head>
<body>
  <div class="stage" aria-label="Loading">
    <canvas id="loader" width="400" height="400"></canvas>
  </div>

  <script src="https://unpkg.com/d3-array@3.2.4/dist/d3-array.min.js"></script>
  <script src="https://unpkg.com/d3-geo@3.1.1/dist/d3-geo.min.js"></script>
  <script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <script>
    (async () => {
      const canvas = document.getElementById('loader');
      const ctx = canvas.getContext('2d');
      const DPR = 2; // canvas backing 400x400 for crispness
      const SIZE = 200;        // CSS size
      const CENTER = SIZE / 2; // 100
      const R = 64;            // globe radius in CSS px
      const INK = '#1a1a1a';
      const BG = '#f1ede6';

      ctx.scale(DPR, DPR); // draw in CSS pixel units

      // Load world topology
      let land, countries;
      try {
        const res = await fetch('https://unpkg.com/world-atlas@2.0.2/countries-110m.json');
        const topo = await res.json();
        countries = topojson.feature(topo, topo.objects.countries);
        land = topojson.merge(topo, topo.objects.countries.geometries);
      } catch (e) {
        console.error('Failed to load world atlas', e);
      }

      const projection = d3.geoOrthographic()
        .scale(R)
        .translate([CENTER, CENTER])
        .clipAngle(90);

      const path = d3.geoPath(projection, ctx);

      // Graticule
      const graticule = d3.geoGraticule10();

      // Whirl: a set of orbiting arcs around the globe at different radii,
      // each rotating at its own speed and offset
      const whirls = [
        { r: R + 12, span: 70, speed: 0.9,  width: 1.25, dash: null,         alpha: 0.85 },
        { r: R + 20, span: 50, speed: -1.4, width: 1.0,  dash: [3, 4],       alpha: 0.65 },
        { r: R + 28, span: 95, speed: 0.6,  width: 0.9,  dash: [1, 3],       alpha: 0.55 },
        { r: R + 36, span: 30, speed: 1.8,  width: 0.8,  dash: [2, 5],       alpha: 0.45 },
        { r: R + 14, span: 18, speed: -2.2, width: 1.4,  dash: null,         alpha: 0.9  },
      ];

      // Small particles trailing along the outermost whirl
      const particles = Array.from({ length: 14 }, (_, i) => ({
        baseR: R + 8 + (i % 4) * 8,
        phase: (i / 14) * Math.PI * 2,
        speed: 0.7 + (i % 3) * 0.4,
        size: 0.8 + (i % 2) * 0.6,
      }));

      const start = performance.now();
      function frame(now) {
        const t = (now - start) / 1000; // seconds

        // Clear
        ctx.clearRect(0, 0, SIZE, SIZE);

        // Rotate globe: longitude continuously, slight tilt latitude
        const lambda = (t * 28) % 360;          // spin speed deg/sec
        const phi = -18 + Math.sin(t * 0.4) * 4; // gentle wobble
        projection.rotate([lambda, phi, 0]);

        // --- Globe sphere fill (subtle, same as bg but ensures clean edge) ---
        ctx.save();
        ctx.beginPath();
        ctx.arc(CENTER, CENTER, R, 0, Math.PI * 2);
        ctx.fillStyle = BG;
        ctx.fill();
        ctx.clip();

        // Graticule
        ctx.beginPath();
        path(graticule);
        ctx.strokeStyle = INK;
        ctx.globalAlpha = 0.18;
        ctx.lineWidth = 0.6;
        ctx.stroke();

        // Land outlines (countries)
        if (countries) {
          ctx.globalAlpha = 1;
          ctx.beginPath();
          path(countries);
          ctx.fillStyle = INK;
          ctx.globalAlpha = 0.88;
          ctx.fill();
        }

        // Country borders for crispness
        if (countries) {
          ctx.beginPath();
          path(countries);
          ctx.globalAlpha = 1;
          ctx.lineWidth = 0.4;
          ctx.strokeStyle = BG;
          ctx.stroke();
        }

        ctx.restore();

        // Sphere outline
        ctx.beginPath();
        ctx.arc(CENTER, CENTER, R, 0, Math.PI * 2);
        ctx.lineWidth = 1.25;
        ctx.strokeStyle = INK;
        ctx.globalAlpha = 1;
        ctx.stroke();

        // --- Whirl arcs ---
        ctx.lineCap = 'round';
        for (const w of whirls) {
          const a0 = (t * w.speed * 60) * Math.PI / 180;
          const span = w.span * Math.PI / 180;
          ctx.beginPath();
          ctx.arc(CENTER, CENTER, w.r, a0, a0 + span);
          ctx.lineWidth = w.width;
          ctx.strokeStyle = INK;
          ctx.globalAlpha = w.alpha;
          if (w.dash) ctx.setLineDash(w.dash); else ctx.setLineDash([]);
          ctx.stroke();
        }
        ctx.setLineDash([]);

        // --- Whirl particles (tiny dots orbiting) ---
        for (const p of particles) {
          const a = p.phase + t * p.speed;
          const px = CENTER + Math.cos(a) * p.baseR;
          const py = CENTER + Math.sin(a) * p.baseR;
          ctx.beginPath();
          ctx.arc(px, py, p.size, 0, Math.PI * 2);
          ctx.fillStyle = INK;
          ctx.globalAlpha = 0.55;
          ctx.fill();
        }

        // --- Trailing comet streak around outer ring ---
        const streakA = t * 2.0;
        const streakSpan = 0.9; // radians
        const steps = 24;
        for (let i = 0; i < steps; i++) {
          const f = i / steps;
          const a = streakA - f * streakSpan;
          const rr = R + 44 - f * 6;
          ctx.beginPath();
          ctx.arc(
            CENTER + Math.cos(a) * rr,
            CENTER + Math.sin(a) * rr,
            (1 - f) * 1.4 + 0.2,
            0, Math.PI * 2
          );
          ctx.fillStyle = INK;
          ctx.globalAlpha = (1 - f) * 0.55;
          ctx.fill();
        }

        ctx.globalAlpha = 1;
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
